name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag on main, for example v0.1.0'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Validate tag, workspace versions and main ancestry
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node --experimental-strip-types tools/release.ts

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}

  notes:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    permissions:
      # GitHub's generate-notes API requires write permission even though it does not save a release.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Generate Chinese and English changelogs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          CHANGELOG_API_KEY: ${{ secrets.CHANGELOG_API_KEY }}
          CHANGELOG_API_URL: ${{ secrets.CHANGELOG_API_URL }}
          CHANGELOG_MODEL: ${{ secrets.CHANGELOG_MODEL }}
        run: node --experimental-strip-types tools/changelog.ts
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: release-notes
          path: outputs/release-notes/*.md
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: prepare
    uses: ./.github/workflows/native-desktop.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}

  macos:
    needs: [prepare, notes]
    uses: ./.github/workflows/macos-desktop.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
    secrets: inherit

  publish:
    needs: [prepare, checks, notes, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:engine
      - name: Verify the pinned Windows environment is already available
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types tools/qemu-release.ts verify
      - name: Require exact validated artifact cohorts
        env:
          MAC_RUNTIME: ${{ needs.macos.outputs.runtime_artifact }}
          MAC_CLIENT: ${{ needs.macos.outputs.client_artifact }}
          WINDOWS_RUNTIME: ${{ needs.windows.outputs.runtime_artifact }}
          WINDOWS_CLIENT: ${{ needs.windows.outputs.client_artifact }}
          WINDOWS_INSTALLER: ${{ needs.windows.outputs.installer_artifact }}
          NOTES: ${{ needs.notes.outputs.artifact_id }}
        run: |
          for artifact in "$MAC_RUNTIME" "$MAC_CLIENT" "$WINDOWS_RUNTIME" "$WINDOWS_CLIENT" "$WINDOWS_INSTALLER" "$NOTES"; do
            [[ "$artifact" =~ ^[1-9][0-9]*$ ]] || exit 1
          done
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.windows.outputs.runtime_artifact }}
          path: components
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.macos.outputs.runtime_artifact }}
          path: macos-runtime
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.macos.outputs.client_artifact }}
          path: macos-client
          merge-multiple: true
      - name: Verify source, digests and the Mac client/runtime binding
        run: node --experimental-strip-types tools/macos.ts stage macos-runtime macos-client components release
      - name: Publish immutable runtime components before the client becomes available
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: node --experimental-strip-types tools/component.ts publish components
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.windows.outputs.client_artifact }}
          path: windows
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.windows.outputs.installer_artifact }}
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.notes.outputs.artifact_id }}
          path: notes
          merge-multiple: true
      - name: Create Windows archive and checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd windows
          zip -q -r "../release/Daban-$VERSION-windows-x64.zip" .
          cd ../release
          cp ../notes/CHANGELOG.*.md .
          sha256sum Daban-* CHANGELOG.*.md *.yml > SHA256SUMS.txt
      - name: Publish release after all checks and notarization succeed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          # Signing can take a while; never attach old binaries to a tag moved during the build.
          actual_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          test "$actual_commit" = "$EXPECTED_COMMIT"
          args=()
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Daban $RELEASE_TAG" --notes-file notes/notes.md "${args[@]}"
