name: Signed macOS desktop

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
    outputs:
      runtime_artifact:
        value: ${{ jobs.runtime.outputs.artifact_id }}
        description: Verified runtime cohort artifact
      client_artifact:
        value: ${{ jobs.macos.outputs.artifact_id }}
        description: Verified client cohort artifact

permissions:
  contents: read

concurrency:
  group: macos-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime_prepare:
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      cache_hit: ${{ steps.saved.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build
      - uses: actions/cache/restore@v4
        id: saved
        with:
          path: ${{ runner.temp }}/runtime-cache
          key: release-runtime-${{ github.run_id }}
      - name: Reuse a completed run checkpoint or published immutable runtime
        id: cached
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_CACHE: ${{ steps.saved.outputs.cache-hit == 'true' && format('{0}/runtime-cache', runner.temp) || '' }}
        run: node --experimental-strip-types tools/macos.ts runtime-cache "$RUNNER_TEMP/runtime-input"
      - name: Download the sealed credential-free Linux base
        if: steps.cached.outputs.cached != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT_TAG: ${{ vars.MACOS_ENVIRONMENT_TAG || 'environment-v38' }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/environment"
          gh release download "$ENVIRONMENT_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/environment" --pattern manifest.json --pattern lima.tar.gz --pattern COMPONENTS.md
      - name: Download official standalone Node for the host
        if: steps.cached.outputs.cached != 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output node.tar.gz https://nodejs.org/dist/v24.22.1/node-v24.22.1-darwin-arm64.tar.gz
          curl --fail --location --retry 3 --output SHASUMS256.txt https://nodejs.org/dist/v24.22.1/SHASUMS256.txt
          expected=$(awk '$2 == "node-v24.22.1-darwin-arm64.tar.gz" {print $1}' SHASUMS256.txt)
          test -n "$expected"
          printf '%s  node.tar.gz\n' "$expected" | shasum -a 256 --check
          tar -xzf node.tar.gz
      - uses: ./.github/actions/macos-signing
        id: signing
        if: steps.cached.outputs.cached != 'true'
        with:
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          apple-id: ${{ secrets.APPLE_ID }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}
          app-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      - name: Prepare signed and accepted runtime bytes
        if: steps.cached.outputs.cached != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          MACOS_KEYCHAIN: ${{ runner.temp }}/daban-signing.keychain-db
          MACOS_NOTARY_PROFILE: daban-release
        run: node --experimental-strip-types tools/macos.ts runtime-prepare "$RUNNER_TEMP/node-v24.22.1-darwin-arm64" "$RUNNER_TEMP/runtime-input" "$RUNNER_TEMP/environment"
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/daban-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/daban-certificate.p12" "$RUNNER_TEMP/daban-signing-probe"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: Daban-macos-runtime-prepared-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-input
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  runtime:
    needs: runtime_prepare
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build:engine
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.runtime_prepare.outputs.artifact_id }}
          path: ${{ runner.temp }}/runtime-input
          merge-multiple: true
      - name: Restore, staple and validate the accepted runtime
        run: node --experimental-strip-types tools/macos.ts runtime-finish "$RUNNER_TEMP/runtime-input" "$RUNNER_TEMP/runtime-ready"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: Daban-runtime-macos-arm64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-ready
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/cache/save@v4
        if: needs.runtime_prepare.outputs.cache_hit != 'true'
        with:
          path: ${{ runner.temp }}/runtime-ready
          key: release-runtime-${{ github.run_id }}

  client_prepare:
    needs: runtime
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.runtime.outputs.artifact_id }}
          path: ${{ runner.temp }}/runtime-ready
          merge-multiple: true
      - uses: ./.github/actions/macos-signing
        id: signing
        with:
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          apple-id: ${{ secrets.APPLE_ID }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}
          app-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      - name: Prepare signed and accepted client bytes
        env:
          MACOS_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          MACOS_KEYCHAIN: ${{ runner.temp }}/daban-signing.keychain-db
          MACOS_NOTARY_PROFILE: daban-release
        run: node --experimental-strip-types tools/macos.ts client-prepare "$RUNNER_TEMP/runtime-ready" "$RUNNER_TEMP/client-input"
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/daban-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/daban-certificate.p12" "$RUNNER_TEMP/daban-signing-probe"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: Daban-macos-client-prepared-${{ github.run_attempt }}
          path: ${{ runner.temp }}/client-input
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  macos:
    needs: [runtime, client_prepare]
    runs-on: macos-15
    timeout-minutes: 40
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: |
          npm run build:engine
          npm run build --workspace @daban/runtime
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.runtime.outputs.artifact_id }}
          path: ${{ runner.temp }}/runtime-ready
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.client_prepare.outputs.artifact_id }}
          path: ${{ runner.temp }}/client-input
          merge-multiple: true
      - name: Resume tickets, Gatekeeper, packaging and runtime publisher validation
        run: node --experimental-strip-types tools/macos.ts client-finish "$RUNNER_TEMP/runtime-ready" "$RUNNER_TEMP/client-input" "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: Daban-macos-arm64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
