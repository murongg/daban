name: Native desktop
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/local-computer']
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tools/**'
      - 'package*.json'
      - '.github/workflows/native-desktop.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Test desktop bindings and authority
        run: npx vitest run apps/desktop/electron/native.test.ts apps/desktop/electron/driver.test.ts apps/desktop/electron/local-computer.test.ts apps/desktop/electron/local-server.test.ts apps/desktop/src/LocalComputer.test.tsx --maxWorkers=2
      - name: Test native-only startup and encrypted private transport
        run: node --experimental-sqlite --test packages/engine/dist/private-channel.test.js packages/engine/dist/native-agent.test.js dist-agent/native-loop.test.js
      - name: Verify Windows native module ABI
        run: node -e "const n=require('@computer-use/libnut-win32'); for(const k of ['moveMouse','keyTap','typeString','getActiveWindow']) if(typeof n[k]!=='function') throw Error(k)"
      - name: Build portable Windows client
        shell: pwsh
        run: |
          $env:DABAN_NODE_DIRECTORY = Split-Path (Get-Command node).Source
          npm run bundle:windows -- outputs/Daban-win-x64 $env:DABAN_NODE_DIRECTORY
      - uses: actions/upload-artifact@v4
        with:
          name: Daban-windows-x64
          path: outputs/Daban-win-x64
          retention-days: 7
