name: Native desktop
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Test desktop bindings and authority
        run: npx vitest run apps/desktop/electron/runtime.test.ts apps/desktop/electron/native.test.ts apps/desktop/electron/driver.test.ts apps/desktop/electron/local-computer.test.ts apps/desktop/electron/local-server.test.ts apps/desktop/electron/native-daemon.test.ts apps/desktop/electron/components.test.ts apps/desktop/electron/component-install.test.ts apps/desktop/electron/host-selection.test.ts apps/desktop/electron/environment-client.test.ts apps/desktop/src/features/computer/LocalComputer.test.tsx --maxWorkers=2
      - name: Test native-only startup and encrypted private transport
        run: npx vitest run --project node packages/engine/dist/private-channel.test.js packages/engine/dist/private-files.test.js packages/engine/dist/durability.test.js packages/engine/dist/native-agent.test.js --maxWorkers=2
      - name: Verify model icons and configuration
        run: npx vitest run apps/desktop/src/features/models/ModelInputs.test.tsx apps/desktop/src/features/models/Providers.test.tsx apps/desktop/src/features/models/BotModels.test.tsx apps/desktop/src/features/models/Models.test.tsx --maxWorkers=2
      - name: Verify skill package UI and bindings
        run: npx vitest run apps/desktop/electron/skills.test.ts apps/desktop/electron/portable.test.ts apps/desktop/src/features/skills/SkillInstall.test.tsx apps/desktop/src/features/skills/SkillMetadata.test.tsx --maxWorkers=2
      - name: Verify standard skill packages
        run: npx vitest run --project node packages/engine/dist/skill-defaults.test.js packages/engine/dist/skill-discovery.test.js packages/engine/dist/skill-package.test.js packages/engine/dist/skills-packages.test.js packages/engine/dist/skill-tools.test.js packages/engine/dist/skill-sources.test.js packages/engine/dist/workspace-skills.test.js --maxWorkers=2
      - name: Verify native DSH tool loop
        timeout-minutes: 3
        run: |
          npx vitest run --project node dist-agent/native-loop.test.js dist-agent/calendar.test.js dist-agent/update.test.js packages/engine/dist/upgrade.test.js packages/engine/dist/web.test.js packages/engine/dist/web-read.test.js packages/engine/dist/schedules.test.js packages/engine/dist/documents.test.js --maxWorkers=2
          node --experimental-sqlite --test packages/engine/dist/upgrade.integration.js packages/engine/dist/schedules.integration.js
      - name: Verify bundled native cryptography
        run: |
          npx vitest run --project node tools/native.test.ts tools/preload.test.ts tools/roles.test.ts --maxWorkers=2
          node --experimental-strip-types --test tools/roles.integration.ts
      - name: Verify Electron encrypted transport
        run: node --experimental-strip-types tools/native.ts transport
      - name: Verify Windows native module ABI
        run: node --experimental-strip-types tools/native.ts abi
      - name: Reuse an immutable runtime when its sources are unchanged
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types tools/component.ts fetch "${{ runner.temp }}/runtime"
      - name: Build the separate Windows runtime
        if: steps.runtime.outputs.cached != 'true'
        shell: pwsh
        run: |
          $node = Split-Path (Get-Command node).Source
          node --experimental-strip-types tools/component.ts build "${{ runner.temp }}/runtime" $node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the small portable Windows client
        shell: pwsh
        run: |
          node --experimental-strip-types tools/component.ts reference "${{ runner.temp }}/runtime/Daban-runtime-windows-x64.zip" "${{ runner.temp }}/runtime/runtime-windows-x64.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-strip-types tools/windows.ts "${{ runner.temp }}/Daban-win-x64" "${{ runner.temp }}/runtime/runtime-windows-x64.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Daban-runtime-windows-x64
          path: |
            ${{ runner.temp }}/runtime/Daban-runtime-windows-x64.zip
            ${{ runner.temp }}/runtime/runtime-windows-x64.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Verify the extracted runtime against its pinned archive
        run: node --experimental-strip-types tools/component.ts validate "${{ runner.temp }}/Daban-win-x64/Daban.exe" "${{ runner.temp }}/runtime/Daban-runtime-windows-x64.zip" "${{ runner.temp }}/runtime/runtime-windows-x64.json"
      - name: Verify packaged dependencies and first-use startup
        timeout-minutes: 6
        run: node --experimental-strip-types tools/windows.acceptance.ts "${{ runner.temp }}/Daban-win-x64" "${{ runner.temp }}/runtime/Daban-runtime-windows-x64.zip"
      - name: Build per-user Windows installer and update metadata
        run: node --experimental-strip-types tools/installer.ts "${{ runner.temp }}/Daban-win-x64" "${{ runner.temp }}/Daban-installer"
      - name: Verify isolated Windows online update and draft preservation
        timeout-minutes: 8
        run: node --experimental-strip-types tools/updates.acceptance.ts
      - uses: actions/upload-artifact@v4
        with:
          name: Daban-windows-x64
          path: ${{ runner.temp }}/Daban-win-x64
          retention-days: 7
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: Daban-windows-installer
          path: |
            ${{ runner.temp }}/Daban-installer/*.exe
            ${{ runner.temp }}/Daban-installer/*.blockmap
            ${{ runner.temp }}/Daban-installer/latest*.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
