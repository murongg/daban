name: Native desktop
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/local-computer']
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tools/**'
      - 'package*.json'
      - '.github/workflows/native-desktop.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Test desktop bindings and authority
        run: npx vitest run apps/desktop/electron/runtime.test.ts apps/desktop/electron/native.test.ts apps/desktop/electron/driver.test.ts apps/desktop/electron/local-computer.test.ts apps/desktop/electron/local-server.test.ts apps/desktop/electron/native-daemon.test.ts apps/desktop/src/LocalComputer.test.tsx --maxWorkers=2
      - name: Test native-only startup and encrypted private transport
        run: node --experimental-sqlite --test packages/engine/dist/private-channel.test.js packages/engine/dist/private-files.test.js packages/engine/dist/durability.test.js packages/engine/dist/native-agent.test.js
      - name: Verify native DSH tool loop
        timeout-minutes: 3
        run: node --experimental-sqlite --test dist-agent/native-loop.test.js
      - name: Verify bundled native cryptography
        run: node --experimental-strip-types --test tools/native.test.ts tools/preload.test.ts
      - name: Verify Electron encrypted transport
        run: node --experimental-strip-types tools/native.ts transport
      - name: Verify Windows native module ABI
        run: node --experimental-strip-types tools/native.ts abi
      - name: Build portable Windows client
        shell: pwsh
        run: |
          $env:DABAN_NODE_DIRECTORY = Split-Path (Get-Command node).Source
          $bundle = Join-Path $env:RUNNER_TEMP 'Daban-win-x64'
          npm run bundle:windows -- $bundle $env:DABAN_NODE_DIRECTORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify packaged native module and DSH dependencies
        shell: pwsh
        timeout-minutes: 3
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'Daban-win-x64'
          $env:ELECTRON_RUN_AS_NODE = '1'
          & "$bundle/Daban.exe" --experimental-strip-types tools/native.ts abi "$bundle/resources/app/package.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
          $smoke = "$bundle/resources/agent/native-loop.test.js"
          Copy-Item dist-agent/native-loop.test.js $smoke
          try {
            & "$bundle/resources/agent/node/node.exe" --experimental-sqlite --test $smoke
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item $smoke
          }
      - name: Verify packaged client first-use startup
        timeout-minutes: 3
        run: node --experimental-strip-types tools/windows.acceptance.ts "${{ runner.temp }}/Daban-win-x64"
      - uses: actions/upload-artifact@v4
        with:
          name: Daban-windows-x64
          path: ${{ runner.temp }}/Daban-win-x64
          retention-days: 7
          include-hidden-files: true
