name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build
      # The build already ran lint and generated the declarations needed here.
      - run: npm run check:types
      - name: Verify native API fallback with the installed SDK
        env:
          DABAN_TEST_SDK: ${{ github.workspace }}/node_modules/@deepseek-ai/dsh-sdk-client/lib/index.js
        run: |
          test -f "$DABAN_TEST_SDK"
          node --experimental-sqlite --test --test-concurrency=2 packages/engine/dist/model-fallback.integration.js
      - name: Verify independent Cloudflare gallery bundle
        run: npm run check:cf --workspace @daban/gallery
      - name: Install browser integration runtime
        run: npx playwright install --with-deps --only-shell chromium
      # Playwright already refreshed the apt indexes on Linux.
      - name: Install Linux desktop runtime dependencies
        if: runner.os == 'Linux'
        run: &install-desktop-deps >-
          sudo apt-get install -y --no-install-recommends
          bubblewrap xvfb xauth x11-utils dbus-x11 x11-xserver-utils
          tint2 openbox wmctrl python3 xdotool xclip xterm thunar mousepad
      - name: Allow the test browser to create its sandbox on Ubuntu
        if: runner.os == 'Linux'
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            # Scope the user-namespace allowance to the downloaded test browser; retain chromiumSandbox.
            cat > "$RUNNER_TEMP/daban-playwright-tests" <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile daban-playwright-tests @{HOME}/.cache/ms-playwright/**/chrome-headless-shell flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo install -m 0644 "$RUNNER_TEMP/daban-playwright-tests" /etc/apparmor.d/daban-playwright-tests
            sudo apparmor_parser -r /etc/apparmor.d/daban-playwright-tests
          fi
      - name: Verify standalone browser file workflows and visual takeover
        run: node --experimental-sqlite --test packages/engine/dist/host-browser.integration.js
      - name: Verify embedded browser input, verification and file workflows
        # Desktop clients ship on macOS and Windows; Ubuntu verifies the Linux execution service below.
        if: runner.os == 'macOS'
        run: node --experimental-strip-types tools/embedded-browser.ts
      - run: node --experimental-strip-types --test tools/roles.integration.ts
      - name: Verify idle-only host update handoff
        if: runner.os == 'macOS'
        run: node --experimental-sqlite --test packages/engine/dist/upgrade.integration.js
      - name: Linux integration regressions
        if: runner.os == 'Linux'
        run: |
          node --experimental-strip-types tools/runtime.ts
          node --experimental-strip-types tools/tests.ts runtime --integration-only
      - name: Verify legacy Agent upgrade in a disposable launchd scope
        if: runner.os == 'macOS'
        run: |
          if launchctl print "gui/$(id -u)" >/dev/null 2>&1; then
            DABAN_LAUNCHD_TEST=1 npx vitest run apps/desktop/electron/legacy.integration.test.ts
          else
            echo "No interactive launchd domain on this runner; scoped OS integration is covered by the local verification and mocked ownership tests."
          fi
      - name: Native macOS module ABI
        if: runner.os == 'macOS'
        run: node --experimental-strip-types tools/native.ts abi
      - name: Verify isolated macOS online update and draft preservation
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: node --experimental-strip-types tools/updates.acceptance.ts

  regressions:
    name: Regressions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Refresh apt indexes
        if: runner.os == 'Linux'
        run: sudo apt-get update
      - name: Install Linux desktop runtime dependencies
        if: runner.os == 'Linux'
        run: *install-desktop-deps
      - run: npm test -- --maxWorkers=2
