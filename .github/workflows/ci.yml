name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build
      - run: npm run typecheck
      - name: Verify independent Cloudflare gallery bundle
        run: npm run check:cf --workspace @daban/gallery
      - name: Verify native API fallback with the installed SDK
        env:
          DABAN_TEST_SDK: ${{ github.workspace }}/node_modules/@deepseek-ai/dsh-sdk-client/lib/index.js
        run: |
          test -f "$DABAN_TEST_SDK"
          node --experimental-sqlite --test --test-concurrency=2 packages/engine/dist/model-fallback.integration.js
      # Runtime unit tests need these tools during the single full Vitest pass.
      - name: Install Linux desktop runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apparmor bubblewrap xvfb xauth x11-utils dbus-x11 x11-xserver-utils tint2 openbox wmctrl python3 xdotool xclip xterm thunar mousepad
      - name: Install Chromium for profile isolation regressions
        if: runner.os == 'Linux'
        run: npx --no-install playwright install --with-deps chromium
      - name: Permit sandbox namespaces for CI Chromium
        if: runner.os == 'Linux'
        # Ubuntu restricts namespaces for downloaded browsers; keep Chromium's sandbox and scope the exception to these CI binaries.
        # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
        run: |
          sudo tee /etc/apparmor.d/daban-playwright >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>

          profile daban-playwright-chrome /home/runner/.cache/ms-playwright/**/chrome flags=(unconfined) {
            userns,
          }
          profile daban-playwright-headless-shell /home/runner/.cache/ms-playwright/**/chrome-headless-shell flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/daban-playwright
      - run: npx vitest run --maxWorkers=2
      - run: node --experimental-strip-types --test tools/roles.integration.ts
      - name: Verify idle-only host update handoff
        if: runner.os == 'macOS'
        run: node --experimental-sqlite --test packages/engine/dist/upgrade.integration.js
      - name: Verify native SDK synthetic trajectory
        env:
          DABAN_TEST_SDK: ${{ github.workspace }}/node_modules/@deepseek-ai/dsh-sdk-client/lib/index.js
        run: node --experimental-sqlite --test packages/engine/dist/transcripts.integration.js
      - name: Linux integration regressions
        if: runner.os == 'Linux'
        run: |
          node --experimental-strip-types tools/runtime.ts
          node --experimental-strip-types tools/tests.ts runtime --integration-only
      - name: Verify legacy Agent upgrade in a disposable launchd scope
        if: runner.os == 'macOS'
        run: |
          if launchctl print "gui/$(id -u)" >/dev/null 2>&1; then
            DABAN_LAUNCHD_TEST=1 npx vitest run apps/desktop/electron/legacy.integration.test.ts
          else
            echo "No interactive launchd domain on this runner; scoped OS integration is covered by the local verification and mocked ownership tests."
          fi
      - name: Native macOS module ABI
        if: runner.os == 'macOS'
        run: node --experimental-strip-types tools/native.ts abi
      - name: Verify isolated macOS online update and draft preservation
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: node --experimental-strip-types tools/updates.acceptance.ts
