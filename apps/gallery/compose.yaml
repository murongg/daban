services:
  gallery:
    build:
      context: ../..
      dockerfile: apps/gallery/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      GALLERY_PUBLIC_ORIGIN: ${GALLERY_PUBLIC_ORIGIN:?Set your HTTPS gallery origin}
      GALLERY_READ_MODE: ${GALLERY_READ_MODE:-private}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      GALLERY_GITHUB_ADMIN_IDS: ${GALLERY_GITHUB_ADMIN_IDS:-}
      GALLERY_GITHUB_ALLOWED_IDS: ${GALLERY_GITHUB_ALLOWED_IDS:-}
    volumes:
      - gallery-data:/data
    restart: unless-stopped
volumes:
  gallery-data:
